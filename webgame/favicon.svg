<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <!-- 2x2 gridworld -->
  <g stroke="#0F172A" stroke-width="2" fill="none">
    <rect x="16" y="16" width="32" height="32"/>
    <path d="M32 16 V48"/>
    <path d="M16 32 H48"/>
  </g>
  <!-- policy path: right then up (ends under the arrowhead) -->
  <path d="M22 42 H42 V24" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- symmetric arrowhead pointing up -->
  <path d="M42 19 l-4.5 9 h9 z" fill="#0F172A"/>
</svg>
